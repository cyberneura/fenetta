name: Fenetta
options:
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: false
targets:
  Fenetta:
    type: application
    platform: iOS
    sources:
      - Fenetta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytyng.Fenetta
        DEVELOPMENT_TEAM: 2YN5TLNQ9J
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Fenetta/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Fenetta:
    build:
      targets:
        Fenetta: all
    run:
      config: Debug
    archive:
      config: Release
